name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bot (Node)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

      # Trainer (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scikit-learn
      - run: python -m unittest -v test_trainer
        working-directory: trainer

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # vetobot: draait op de thuisserver
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # vetobot-trainer: draait op de VPS (Intel/AMD en ARM)
      - uses: docker/build-push-action@v6
        with:
          context: ./trainer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-trainer:latest
            ghcr.io/${{ github.repository }}-trainer:${{ github.sha }}
